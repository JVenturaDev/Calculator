name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: calculator-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Angular compiler
        run: npx ngc -p tsconfig.app.json

      - name: TypeScript app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: TypeScript specs
        run: npx tsc --noEmit -p tsconfig.spec.json

      - name: Karma tests
        run: npm test -- --progress=false --watch=false

      - name: Production build
        run: npx ng build --configuration production --base-href "/Calculator/"

      - name: Add SPA fallback
        run: cp dist/angular-calculator/index.html dist/angular-calculator/404.html

      - name: Verify Pages artifact
        run: |
          test -f dist/angular-calculator/index.html
          test -f dist/angular-calculator/404.html
          test -f dist/angular-calculator/favicon.ico
          grep -q '<base href="/Calculator/">' dist/angular-calculator/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: front-end/dist/angular-calculator

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
