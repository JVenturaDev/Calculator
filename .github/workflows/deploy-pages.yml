name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: calculator-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Use npm 11.6.2
        working-directory: front-end
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Angular compiler
        run: npx ngc -p tsconfig.app.json

      - name: TypeScript app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: TypeScript specs
        run: npx tsc --noEmit -p tsconfig.spec.json

      - name: Karma tests
        run: npm test -- --progress=false --watch=false

      - name: Production build
        run: npx ng build --configuration production --base-href "/Calculator/"

      - name: Add SPA fallback
        run: cp dist/angular-calculator/index.html dist/angular-calculator/404.html

      - name: Verify Pages artifact
        run: |
          test -f dist/angular-calculator/index.html
          test -f dist/angular-calculator/404.html
          test -f dist/angular-calculator/favicon.ico
          grep -q '<base href="/Calculator/">' dist/angular-calculator/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: front-end/dist/angular-calculator

  validate-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back-end
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/calculator_test
      TEST_DB_USERNAME: calculator_test_user
      TEST_DB_PASSWORD: calculator_ci_test_password
      TEST_JWT_SECRET: calculator-ci-only-jwt-secret-not-for-production-0123456789abcdef
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: calculator_test
          POSTGRES_USER: calculator_test_user
          POSTGRES_PASSWORD: calculator_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calculator_test_user -d calculator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: back-end/pom.xml

      - name: Backend tests
        run: bash ./mvnw --batch-mode test

      - name: Backend package
        run: bash ./mvnw --batch-mode package -DskipTests

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-build
      - validate-backend
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
